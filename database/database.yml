AWSTemplateFormatVersion: '2010-09-09'
Description: Minimal DynamoDB table for quiz progress or other app data.

Parameters:
  TableName:
    Type: String
    Default: bhs-quiz-progress
    Description: DynamoDB table name

Resources:
  QuizProgressTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

Outputs:
  TableName:
    Description: DynamoDB table name
    Value: !Ref QuizProgressTable
  TableArn:
    Description: DynamoDB table ARN
    Value: !GetAtt QuizProgressTable.Arn
