AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  OIDC Provider and IAM Role for GitHub Actions.
  Allows GitHub Actions to assume an IAM Role without AWS access keys.
  対象リポジトリ:
    - bhs-webapp  : S3 + CloudFront (静的サイトデプロイ)
    - bhs-webapi  : Lambda (quiz-api などのコードデプロイ)

Parameters:
  Prefix:
    Type: String
    Default: dev-apne1
    Description: Environment prefix (e.g. dev-apne1).

  GitHubOrg:
    Type: String
    Default: nozomishira
    Description: GitHub organization or user name.

  WebAppRepo:
    Type: String
    Default: bhs-webapp
    Description: GitHub repository name for the webapp (S3/CloudFront デプロイ用).

  WebApiRepo:
    Type: String
    Default: bhs-webapi
    Description: GitHub repository name for the webapi (Lambda デプロイ用).

  Branch:
    Type: String
    Default: develop
    Description: >-
      Branch allowed to assume this role via OIDC.
      dev環境は develop、test環境は test、prod環境は main を指定する想定。

  Env:
    Type: String
    Default: dev

Conditions:
  # OIDCプロバイダーはAWSアカウントごとに1つしか作成できない。
  # dev環境のみ作成し、test/prod は既存プロバイダーを参照する。
  IsDev: !Equals [!Ref Prefix, "dev-apne1"]

Resources:

  # ---------------------------------------------------
  # OIDCプロバイダー: AWSにGitHubを信頼させる設定
  # ---------------------------------------------------
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: IsDev
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  # ---------------------------------------------------
  # IAMロール (webapp用): S3アップロード + CloudFront Invalidation
  # ---------------------------------------------------
  GitHubActionsWebAppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-github-actions-webapp-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - IsDev
                - !GetAtt GitHubOIDCProvider.Arn
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOrg}/${WebAppRepo}:ref:refs/heads/${Branch}"
      Policies:
        - PolicyName: !Sub "${Prefix}-github-actions-webapp-policy"
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # S3へのアップロード権限
              - Sid: AllowS3Sync
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${Prefix}-bhs-indonesia-webapp"
                  - !Sub "arn:aws:s3:::${Prefix}-bhs-indonesia-webapp/*"

              # CloudFrontのキャッシュ削除権限
              - Sid: AllowCloudFrontInvalidation
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: "*"

              # CFnスタックのOutputs参照権限（DistributionIdの動的取得に使用）
              - Sid: AllowCloudFormationDescribeWebapp
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource:
                  - !Sub "arn:aws:cloudformation:ap-northeast-1:${AWS::AccountId}:stack/${Env}-bhs-indonesia-webapp/*"

  # ---------------------------------------------------
  # IAMロール (webapi用): Lambda コードのデプロイ
  # bhs-webapi リポジトリの GitHub Actions が使用する
  # ---------------------------------------------------
  GitHubActionsWebApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-github-actions-webapi-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - IsDev
                - !GetAtt GitHubOIDCProvider.Arn
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOrg}/${WebApiRepo}:ref:refs/heads/${Branch}"
      Policies:
        - PolicyName: !Sub "${Prefix}-github-actions-webapi-policy"
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Lambda コードの更新
              - Sid: AllowLambdaUpdate
                Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:PublishVersion
                  - lambda:GetFunction
                Resource:
                  # quiz-api
                  - !Sub "arn:aws:lambda:ap-northeast-1:${AWS::AccountId}:function:${Prefix}-bhs-quiz-api"
                  # 将来の Lambda を追加する場合はここに追記
                  # - !Sub "arn:aws:lambda:ap-northeast-1:${AWS::AccountId}:function:${Prefix}-bhs-chat-api"

              # CFnスタックのOutputs参照権限（LambdaFunctionName の動的取得に使用）
              - Sid: AllowCloudFormationDescribeWebapi
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource:
                  - !Sub "arn:aws:cloudformation:ap-northeast-1:${AWS::AccountId}:stack/${Env}-bhs-indonesia-webapi/*"

Outputs:
  # 後方互換のため旧名称も残す（既存 GitHub Actions ワークフローが参照している場合に対応）
  GitHubActionsRoleArn:
    Description: "(Deprecated) Use GitHubActionsWebAppRoleArn instead"
    Value: !GetAtt GitHubActionsWebAppRole.Arn
    Export:
      Name: !Sub "${Prefix}-github-actions-role-arn"

  GitHubActionsWebAppRoleArn:
    Description: IAM Role ARN for GitHub Actions (webapp - S3/CloudFront)
    Value: !GetAtt GitHubActionsWebAppRole.Arn
    Export:
      Name: !Sub "${Prefix}-github-actions-webapp-role-arn"

  GitHubActionsWebApiRoleArn:
    Description: IAM Role ARN for GitHub Actions (webapi - Lambda deploy)
    Value: !GetAtt GitHubActionsWebApiRole.Arn
    Export:
      Name: !Sub "${Prefix}-github-actions-webapi-role-arn"
