AWSTemplateFormatVersion: '2010-09-09'
Description: Cognito User Pool + Google IdP for bhs-indonesia-webapp

Parameters:
  Prefix:
    Type: String
    Default: dev-apne1
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  GoogleClientId:
    Type: String
    NoEcho: true
  GoogleClientSecret:
    Type: String
    NoEcho: true
  CallbackUrl:
    Type: String
  LogoutUrl:
    Type: String

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${Prefix}-bhs-user-pool"
      AutoVerifiedAttributes:
        - email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${Prefix}-bhs-auth"
      UserPoolId: !Ref UserPool

  GoogleIdP:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdP
    Properties:
      ClientName: !Sub "${Prefix}-bhs-webapp-client"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Ref CallbackUrl
      LogoutURLs:
        - !Ref LogoutUrl
      SupportedIdentityProviders:
        - Google
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export:
      Name: !Sub "${Prefix}-bhs-user-pool-id"
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub "${Prefix}-bhs-user-pool-arn"
  UserPoolClientId:
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "${Prefix}-bhs-user-pool-client-id"
  CognitoDomain:
    Value: !Sub "${Prefix}-bhs-auth.auth.ap-northeast-1.amazoncognito.com"
    Export:
      Name: !Sub "${Prefix}-bhs-cognito-domain"
