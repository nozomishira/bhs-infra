AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  API Gateway (HTTP API v2) + Lambda (quiz-api, chat-api) for bhs-indonesia-webapp.
  Lambda のコードは CI/CD パイプラインでデプロイする想定のため、
  このテンプレートではインフラ設定のみを管理する。

# ===================================================
# Parameters
# ===================================================
Parameters:
  Prefix:
    Type: String
    Default: dev-apne1
    Description: 環境prefix 例 dev-apne1 test-apne1 prod-apne1

  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]

  LambdaRuntime:
    Type: String
    Default: nodejs24.x
    Description: Lambda ランタイム (Node.js LTS)

  WebAppOrigin:
    Type: String
    Default: "*"
    Description: >-
      CORS AllowOrigin。
      dev は "*"、prod は CloudFront ドメインを指定する
      例: https://xxxxx.cloudfront.net

# ===================================================
# Resources
# ===================================================
Resources:

  # ---------------------------------------------------
  # IAM Role: quiz-api Lambda 実行ロール
  # DynamoDB への読み書き権限を付与
  # ---------------------------------------------------
  QuizApiExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-bhs-quiz-api-lambda-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # CloudWatch Logs への書き込み
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub "${Prefix}-bhs-quiz-api-dynamodb-policy"
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Questions テーブル: 読み取り専用
              - Sid: ReadQuestions
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Prefix}-bhs-questions"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Prefix}-bhs-questions/index/*"

              # Quiz Sessions テーブル: 読み書き
              - Sid: WriteQuizSessions
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Prefix}-bhs-quiz-sessions"

  # ---------------------------------------------------
  # Lambda Function: quiz-api ハンドラ
  # コードは CI/CD でデプロイ。ここではプレースホルダーのみ
  # モノレポ: bhs-webapi/packages/quiz-api でビルド → function.zip
  # ---------------------------------------------------
  QuizApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Prefix}-bhs-quiz-api"
      Description: "bhs quiz API: 問題取得・セッション記録 (bhs-webapi/packages/quiz-api)"
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Role: !GetAtt QuizApiExecutionRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          QUESTIONS_TABLE: !Sub "${Prefix}-bhs-questions"
          SESSIONS_TABLE: !Sub "${Prefix}-bhs-quiz-sessions"
          ENV: !Ref Env
          CORS_ORIGIN: !Ref WebAppOrigin
      # プレースホルダーコード。CI/CD で上書きされる
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            return {
              statusCode: 200,
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: 'bhs-quiz-api placeholder - deploy via CI/CD' })
            };
          };

  # CloudWatch Logs グループ
  # 保持期間: 全環境 3日（コスト最小化）
  QuizApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${QuizApiFunction}"
      RetentionInDays: 3

  # ---------------------------------------------------
  # API Gateway v2 (HTTP API)
  # REST API より安価かつシンプル。
  # 将来 chat-api などを追加する場合は別 HttpApi を作るか、
  # このテンプレートにルートを追加する。
  # ---------------------------------------------------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${Prefix}-bhs-http-api"
      Description: bhs-indonesia-webapp HTTP API
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref WebAppOrigin
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 300

  # Lambda 統合
  QuizApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${QuizApiFunction.Arn}/invocations"
      PayloadFormatVersion: '2.0'

  # ------- ルート定義 -------

  # GET /health (認証なし - ヘルスチェック用)
  RouteHealth:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /health"
      Target: !Sub "integrations/${QuizApiIntegration}"

  # GET /levels
  RouteLevels:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /levels"
      Target: !Sub "integrations/${QuizApiIntegration}"

  # GET /questions
  RouteQuestions:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /questions"
      Target: !Sub "integrations/${QuizApiIntegration}"

  # POST /sessions
  RouteSessions:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /sessions"
      Target: !Sub "integrations/${QuizApiIntegration}"

  # ステージ
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  # Lambda への実行許可 (quiz-api)
  PermissionForAPIGatewayQuizApi:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref QuizApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

  # ===================================================
  # chat-api: Bedrock 会話練習 Lambda
  # ===================================================

  # IAM Role: chat-api Lambda 実行ロール
  # Bedrock InvokeModel 権限を付与
  ChatApiExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-bhs-chat-api-lambda-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub "${Prefix}-bhs-chat-api-bedrock-policy"
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Bedrock モデル呼び出し権限
              - Sid: AllowBedrockInvoke
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/jp.anthropic.claude-haiku-4-5-20251001-v1:0"
                  - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"

              # DynamoDB: Chat Sessions テーブル読み書き
              - Sid: ChatSessionsDynamoDB
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Prefix}-bhs-chat-sessions"

  # Lambda Function: chat-api
  ChatApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Prefix}-bhs-chat-api"
      Description: "bhs chat API: Bedrock を使ったインドネシア語会話練習 (bhs-webapi/packages/chat-api)"
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Role: !GetAtt ChatApiExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          ENV: !Ref Env
          CORS_ORIGIN: !Ref WebAppOrigin
          BEDROCK_MODEL_ID: jp.anthropic.claude-haiku-4-5-20251001-v1:0
          BEDROCK_REGION: ap-northeast-1
          CHAT_SESSIONS_TABLE: !Sub "${Prefix}-bhs-chat-sessions"
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            return {
              statusCode: 200,
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: 'bhs-chat-api placeholder - deploy via CI/CD' })
            };
          };

  # CloudWatch Logs (chat-api)
  ChatApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChatApiFunction}"
      RetentionInDays: 3

  # Lambda 統合 (chat-api)
  ChatApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ChatApiFunction.Arn}/invocations"
      PayloadFormatVersion: '2.0'

  # POST /chat ルート
  RouteChat:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /chat"
      Target: !Sub "integrations/${ChatApiIntegration}"

  # GET /chat/scenarios ルート
  RouteChatScenarios:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /chat/scenarios"
      Target: !Sub "integrations/${ChatApiIntegration}"

  # GET /chat/health ルート
  RouteChatHealth:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /chat/health"
      Target: !Sub "integrations/${ChatApiIntegration}"

  # POST /chat/evaluate ルート
  RouteChatEvaluate:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /chat/evaluate"
      Target: !Sub "integrations/${ChatApiIntegration}"

  # POST /chat/history ルート
  RouteChatHistorySave:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /chat/history"
      Target: !Sub "integrations/${ChatApiIntegration}"

  # GET /chat/history ルート
  RouteChatHistoryList:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /chat/history"
      Target: !Sub "integrations/${ChatApiIntegration}"

  # GET /chat/history/{sessionId} ルート
  RouteChatHistoryDetail:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /chat/history/{sessionId}"
      Target: !Sub "integrations/${ChatApiIntegration}"

  # Lambda への実行許可 (chat-api)
  PermissionForAPIGatewayChatApi:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ChatApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

# ===================================================
# Outputs
# ===================================================
Outputs:
  ApiEndpoint:
    Description: HTTP API endpoint URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
    Export:
      Name: !Sub "${Prefix}-bhs-http-api-endpoint"

  QuizApiFunctionName:
    Description: quiz-api Lambda function name
    Value: !Ref QuizApiFunction
    Export:
      Name: !Sub "${Prefix}-bhs-quiz-api-function-name"

  QuizApiArn:
    Description: quiz-api Lambda function ARN
    Value: !GetAtt QuizApiFunction.Arn
    Export:
      Name: !Sub "${Prefix}-bhs-quiz-api-function-arn"

  QuizApiRoleArn:
    Description: quiz-api Lambda execution role ARN
    Value: !GetAtt QuizApiExecutionRole.Arn
    Export:
      Name: !Sub "${Prefix}-bhs-quiz-api-role-arn"

  ChatApiFunctionName:
    Description: chat-api Lambda function name
    Value: !Ref ChatApiFunction
    Export:
      Name: !Sub "${Prefix}-bhs-chat-api-function-name"

  ChatApiArn:
    Description: chat-api Lambda function ARN
    Value: !GetAtt ChatApiFunction.Arn
    Export:
      Name: !Sub "${Prefix}-bhs-chat-api-function-arn"

  ChatApiRoleArn:
    Description: chat-api Lambda execution role ARN
    Value: !GetAtt ChatApiExecutionRole.Arn
    Export:
      Name: !Sub "${Prefix}-bhs-chat-api-role-arn"
